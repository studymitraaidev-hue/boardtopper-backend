name: Expire Stale Subscriptions

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-cron endpoint
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://boardtopper-backend.onrender.com/api/subscriptions/expire-cron
