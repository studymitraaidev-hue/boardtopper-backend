name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BoardTopper Backend
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}"             https://boardtopper-backend.onrender.com/api/auth/me             || echo "000")
          echo "Health check returned: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Backend may be down or sleeping"
            exit 0
          fi
          echo "Backend is awake and responding"
